spring.application.name=vocabulary

# Nạp cấu hình cục bộ nếu có (file application-local.properties nằm trong .gitignore)
spring.config.import=optional:classpath:application-local.properties

# ===============================
# Cấu hình kết nối PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/vocabulary_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Cấu hình JPA / Hibernate
# ===============================
# Tự động cập nhật / tạo bảng tương ứng với Entity Java
spring.jpa.hibernate.ddl-auto=update
# Hiển thị câu lệnh SQL trong console khi thao tác dữ liệu
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Cấu hình Gemini API (Google AI)
# Điền API Key của bạn vào biến môi trường GEMINI_API_KEY hoặc tạo file application-local.properties
# ===============================
gemini.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.model=gemini-3.8-flash
