name: Build and Deploy to AWS EC2

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout repository
      uses: actions/checkout@v4

    - name: 2. Cài đặt Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 3. Build Frontend React và copy sang Spring Boot static
      run: |
        cd frontend
        npm ci
        npm run build
        mkdir -p ../backend/src/main/resources/static
        cp -r dist/* ../backend/src/main/resources/static/

    - name: 4. Cài đặt Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 5. Build file JAR Spring Boot
      run: |
        cd backend
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    - name: 6. Tự động chuyển file JAR lên EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "backend/target/vocabulary-0.0.1-SNAPSHOT.jar"
        target: "~/app_temp"
        strip_components: 2

    - name: 7. Khởi động lại ứng dụng trên EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Di chuyển file jar mới vào thư mục chính
          mv ~/app_temp/vocabulary-0.0.1-SNAPSHOT.jar ~/app.jar
          
          # Tắt tiến trình ứng dụng cũ (nếu có)
          sudo pkill -f app.jar || true
          
          # Khởi động lại ứng dụng ngầm với giới hạn bộ nhớ 400MB (phù hợp EC2 1GB RAM)
          nohup java -Xmx400m -jar ~/app.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/vocabulary_db \
            --spring.datasource.username=postgres \
            --spring.datasource.password=123456 > app.log 2>&1 &
          
          echo "Deploy completed successfully! App is running on port 8080."
